# SonarQube Cloud project configuration.
# Replace this value with the organization key from SonarQube Cloud.
sonar.organization=REPLACE_WITH_SONAR_ORGANIZATION
sonar.projectKey=flight-crm
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated, local, and dependency files are not application source.
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/public/**,**/prisma/migrations/**
# Server-rendered UI and dictionaries are verified by the production build and lint; business rules
# remain measured by unit/integration tests. Keeping these presentation files out of line coverage
# prevents a new screen from making the Quality Gate report a misleading coverage regression.
sonar.coverage.exclusions=src/app/**,src/components/**,src/lib/i18n/**
# English and Spanish dictionaries intentionally share the same key structure.
sonar.cpd.exclusions=src/lib/i18n/en.ts,src/lib/i18n/es.ts

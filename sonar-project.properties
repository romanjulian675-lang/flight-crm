# SonarQube Cloud project configuration.
# Replace this value with the organization key from SonarQube Cloud.
sonar.organization=REPLACE_WITH_SONAR_ORGANIZATION
sonar.projectKey=flight-crm
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated, local, and dependency files are not application source.
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/public/**,**/prisma/migrations/**

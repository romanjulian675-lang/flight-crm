name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          status=$?
          cat npm-audit.json
          exit $status

      - name: Summarize dependency audit
        if: always()
        shell: bash
        run: |
          echo "## Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            echo "No audit findings at the configured npm threshold." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm audit reported findings. See the uploaded npm-audit-report artifact; remediation is tracked before making this check blocking." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit.json

  quality:
    name: Test, build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flightcrm
          POSTGRES_PASSWORD: flightcrm
          POSTGRES_DB: flightcrm
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U flightcrm -d flightcrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://flightcrm:flightcrm@localhost:5434/flightcrm
      TEST_DATABASE_URL: postgresql://flightcrm:flightcrm@localhost:5434/flightcrm_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npx prisma generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=flight-crm
